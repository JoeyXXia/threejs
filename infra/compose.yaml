services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: warehouse_twin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - warehouse_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_twin"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    profiles: [reports]
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
  report-worker:
    profiles: [reports]
    build:
      context: ..
      dockerfile: infra/report-worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://warehouse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@postgres:5432/warehouse_twin
      REPORT_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  warehouse_pg:
