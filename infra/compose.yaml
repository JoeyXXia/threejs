services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: warehouse_twin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - warehouse_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_twin"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  warehouse_pg:
