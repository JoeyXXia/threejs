packages:
  - apps/*
  - packages/*

strictPeerDependencies: true
engineStrict: true
saveExact: true
storeDir: .pnpm-store
minimumReleaseAge: 1440
allowBuilds:
  esbuild: true
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@embedded-postgres/windows-x64': true
  '@parcel/watcher': false
  unrs-resolver: false
